name: Swift tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Swift 6.1 / Xcode 16.4
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify declared toolchain
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version)"
          [[ "$xcode_version" == Xcode\ 16.4* ]]
          swift --version

      - name: Test architecture contracts
        run: ruby scripts/test-architecture.rb

      - name: Validate architecture package
        run: ruby scripts/validate-architecture.rb

      - name: Run package tests
        run: swift test
